<!doctype html>

    <link rel="manifest" href="./manifest.webmanifest" />

    <main id="app">
      <canvas id="game-canvas" aria-label="Lizard Kaiju game"></canvas>

      <div id="hit-flash" class="hit-flash"></div>

      <section id="loading" class="screen screen--loading">
        <div class="loading-lizard"><svg><use href="#i-lizard" /></svg></div>
        <div class="loading-bar"><div id="loading-fill" class="loading-fill"></div></div>
      </section>

      <section id="title" class="screen screen--title" hidden>
        <h1 class="logo" aria-label="Lizard Kaiju">
          <span class="logo-line logo-line--small">Lizard</span>
          <span class="logo-line">Kaiju</span>
        </h1>
        <div class="title-buttons">
          <button id="lab-button" class="round-button round-button--small" aria-label="Lizard Lab"><svg viewBox="0 0 80 80"><use href="#i-tab-hat" /></svg></button>
          <button id="play-button" class="round-button round-button--play" aria-label="Play">
            <svg><use href="#i-play" /></svg>
          </button>
          <button id="book-button" class="round-button round-button--small" aria-label="Sticker book"><svg viewBox="0 0 80 80"><use href="#i-book" /></svg></button>
          <button id="endless-button" class="round-button round-button--small round-button--city" aria-label="Endless city" hidden><svg viewBox="0 0 80 80"><use href="#i-city" /></svg></button>
        </div>
        <div class="title-gems gem-counter"><svg class="gem-icon"><use href="#i-gem" /></svg><span id="title-gem-count">0</span></div>
      </section>

      <section id="lab" class="screen screen--lab" hidden>
        <div class="lab-panel">
          <div id="lab-tabs" class="lab-tabs">
            <button data-tab="hats" aria-label="Hats"><svg viewBox="0 0 80 80"><use href="#i-tab-hat" /></svg></button>
            <button data-tab="skins" aria-label="Colors"><svg viewBox="0 0 80 80"><use href="#i-tab-paint" /></svg></button>
            <button data-tab="upgrades" aria-label="Upgrades"><svg viewBox="0 0 80 80"><use href="#i-tab-up" /></svg></button>
            <button data-tab="buddies" aria-label="Buddies"><svg viewBox="0 0 80 80"><use href="#i-tab-paw" /></svg></button>
          </div>
          <div id="lab-grid" class="lab-grid"></div>
        </div>
        <div class="lab-forms">
          <button id="lab-prev" class="arrow-button" aria-label="Previous form"><svg viewBox="0 0 64 64"><use href="#i-play" transform="rotate(180 32 32)" /></svg></button>
          <button id="lab-next" class="arrow-button" aria-label="Next form"><svg viewBox="0 0 64 64"><use href="#i-play" /></svg></button>
        </div>
        <button id="lab-back" class="small-button corner-back" aria-label="Back"><svg><use href="#i-home" /></svg></button>
        <div class="gem-counter lab-gems"><svg class="gem-icon"><use href="#i-gem" /></svg><span id="lab-gem-count">0</span></div>
      </section>

      <section id="book" class="screen screen--book" hidden>
        <div id="book-grid" class="book-page"></div>
        <button id="book-back" class="small-button corner-back" aria-label="Back"><svg><use href="#i-home" /></svg></button>
      </section>

      <section id="hud" class="hud" hidden>
        <div class="hud-top">
          <div id="hearts" class="hearts" aria-label="Hearts"></div>
          <div class="growth">
            <div id="growth-current" class="growth-icon"><svg><use href="#i-lizard" /></svg></div>
            <div class="growth-track"><div id="growth-fill" class="growth-fill"></div><div class="growth-shine"></div></div>
            <div id="growth-next" class="growth-icon growth-icon--next"><svg><use href="#i-lizard" /></svg></div>
          </div>
          <div class="hud-right">
            <div id="gems" class="gem-counter"><svg class="gem-icon"><use href="#i-gem" /></svg><span id="gem-count">0</span></div>
            <button id="pause-button" class="small-button" aria-label="Pause"><svg><use href="#i-pause" /></svg></button>
          </div>
        </div>

        <div id="joystick-zone" class="joystick-zone">
          <div id="joystick-base" class="joystick-base"><div id="joystick-knob" class="joystick-knob"></div></div>
        </div>

        <div class="action-buttons">
          <button id="water-button" class="action-button action-button--water" aria-label="Water" hidden>
            <svg class="energy-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" /></svg>
            <svg class="action-icon"><use href="#i-drop" /></svg>
          </button>
          <button id="fire-button" class="action-button action-button--fire" aria-label="Fire">
            <svg class="energy-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" /></svg>
            <svg class="action-icon"><use href="#i-flame" /></svg>
          </button>
          <button id="mega-button" class="action-button action-button--mega" aria-label="Mega" hidden>
            <svg class="action-icon"><use href="#i-flame" /></svg>
          </button>
        </div>

        <div id="catcher-arrow" class="edge-arrow" hidden><svg class="edge-arrow-face"><use href="#i-catcher" /></svg><div class="edge-arrow-tip"></div></div>
        <div id="tutorial-finger" class="tutorial-finger" hidden><svg><use href="#i-hand" /></svg></div>
        <div id="tutorial-target" class="tutorial-target" hidden></div>

        <div id="escape" class="escape" hidden>
          <svg class="escape-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" /></svg>
          <svg class="escape-hand"><use href="#i-hand" /></svg>
        </div>
      </section>

      <section id="pause" class="screen screen--dim" hidden>
        <div class="button-row">
          <button id="resume-button" class="round-button round-button--play" aria-label="Resume"><svg><use href="#i-play" /></svg></button>
          <button id="home-button" class="round-button round-button--small" aria-label="Home"><svg><use href="#i-home" /></svg></button>
          <button id="sound-button" class="round-button round-button--small" aria-label="Sound"><svg><use href="#i-sound" /></svg></button>
        </div>
      </section>

      <section id="cards" class="screen screen--cards" hidden>
        <div id="card-row" class="card-row"></div>
      </section>

      <section id="victory" class="screen screen--victory" hidden>
        <div class="victory-trophy"><svg><use href="#i-trophy" /></svg></div>
        <div id="victory-stars" class="victory-stars" hidden></div>
        <div class="victory-gems"><svg class="gem-icon"><use href="#i-gem" /></svg><span id="victory-gems">0</span></div>
        <div class="button-row">
          <button id="again-button" class="round-button round-button--play" aria-label="Play again"><svg><use href="#i-play" /></svg></button>
          <button id="victory-home-button" class="round-button round-button--small" aria-label="Home"><svg><use href="#i-home" /></svg></button>
        </div>
      </section>

      <section id="captured" class="screen screen--dim" hidden>
        <button id="retry-button" class="round-button round-button--play" aria-label="Try again"><svg><use href="#i-retry" /></svg></button>
      </section>

      <section id="rotate" class="screen screen--rotate">
        <div class="rotate-device"></div>
      </section>

      <div id="flyers" class="flyers"></div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
